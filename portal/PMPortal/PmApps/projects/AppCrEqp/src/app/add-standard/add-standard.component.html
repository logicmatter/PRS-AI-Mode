<div class="row" align="right" style="margin-top:10px">
  <div class="col-md-12">
    <button type="button" class="btn btn-outline-primary" style="margin-right: 5px" (click)="goBack()" tabindex="12">
      Back
    </button>
    <button *ngIf="_util.showStandardBack" type="button" class="btn btn-outline-primary" style="margin-right: 5px"
      [disabled]="saveDisable" (click)="updateStandard()" tabindex="11">
      Update
    </button>

    <button *ngIf="!_util.showStandardBack" type="button" class="btn btn-outline-primary" style="margin-right: 5px"
      [disabled]="saveDisable" (click)="onSave()" tabindex="10">
      Save
    </button>

  </div>
</div>
<h5 *ngIf="_util.showStandardBack" class="text-center" style="font-family: Arial, Helvetica, sans-serif;">UPDATE STANDARD</h5>
<h5 *ngIf="!_util.showStandardBack" class="text-center" style="font-family: Arial, Helvetica, sans-serif;">ADD STANDARD</h5>

<div class="row">
  <div class="col-md-6">
    <div class="card ">
      <div class="card-body">

        <!-- <label for="standardid"><sup class="mandatory-indication">*</sup>Standard ID</label>
        <angular2-multiselect [data]="dropdownStandardIdsList" [(ngModel)]="selectedStandardIdsItems"
          [settings]="dropdownStandardIdsSettings" (onSelect)="onStandardIdsItemSelect($event)"
          (onDeSelect)="OnStandardIdsItemDeSelect($event)" (onDeSelectAll)="OnItemStandardIdsDeSelectAll($event)"
          tabindex="1" (onAddFilterNewItem)="onAddStandardIdsItem($event)">
        </angular2-multiselect> -->
        <!-- <input type="text" class="form-control" id="standardid" [(ngModel)]="standardid" placeholder="Standard Id"
          required (ngModelChange)="disableButton()" tabindex="2" />
        <p *ngIf="!hasValid" class="error">{{errorMsg}}</p> -->

        <!-- <input type="text" class="form-control" id="eqpType" [(ngModel)]="eqpType" placeholder="Equipment Type" required
          (ngModelChange)="disableButton()" tabindex="1" />
          <p *ngIf="!hasValid1" class="error">{{ errorMsg1 }}</p> -->
        <label for="regulation"><sup class="mandatory-indication">*</sup>Regulation</label>
        <angular2-multiselect [data]="dropdownRegulationList" [(ngModel)]="selectedRegulationItems"
          [settings]="dropdownRegulationSettings" (onSelect)="onRegulationItemSelect($event)"
          (onDeSelect)="OnRegulationItemDeSelect($event)" (onDeSelectAll)="OnRegulationItemDeSelectDeSelectAll($event)" tabindex="1"
          (onAddFilterNewItem)="onAddRegulationItem($event)">
        </angular2-multiselect>
        <label for="eqpType"><sup class="mandatory-indication">*</sup>Equipment Type</label>
        <angular2-multiselect [data]="dropdownRoomTypeList" [(ngModel)]="selectedRoomTypeItems"
          [settings]="dropdownRoomTypeSettings" (onSelect)="onRoomTypeItemSelect($event)"
          (onDeSelect)="OnRoomTypeItemDeSelect($event)" (onDeSelectAll)="OnItemRoomTypeDeSelectAll($event)" tabindex="1"
          (onAddFilterNewItem)="onAddRoomTypeItem($event)">
        </angular2-multiselect>
        <!-- <input type="text" class="form-control" id="regulation" [(ngModel)]="regulation" placeholder="Regulation"
          tabindex="3" /> -->
        <!-- <label for="rulecode"><sup class="mandatory-indication">*</sup>Rule Code</label>
        <angular2-multiselect [data]="dropdownRuleCodeList" [(ngModel)]="selectedRuleCodeItems"
          [settings]="dropdownRuleCodeSettings" (onSelect)="onRuleCodeItemSelect($event)"
          (onDeSelect)="OnRuleCodeItemDeSelect($event)" (onDeSelectAll)="OnItemRuleCodeDeSelectAll($event)" tabindex="1"
          (onAddFilterNewItem)="onAddRuleCodeItem($event)">
        </angular2-multiselect> -->
        <!-- <input type="text" class="form-control" id="rulecode" [(ngModel)]="rulecode" placeholder="Rule Code" required
          (ngModelChange)="disableButton()" tabindex="4" /> -->

      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <label for="facet"><sup class="mandatory-indication">*</sup>Facet</label>
        <angular2-multiselect [data]="dropdownList" [(ngModel)]="selectedItems" [settings]="dropdownSettings"
          (onSelect)="onItemSelect($event)" (onDeSelect)="OnItemDeSelect($event)"
          (onDeSelectAll)="OnItemDeSelect($event)" tabindex="5"></angular2-multiselect>
        <div class="row">
          <div class="col-md-6">
            <label for="criteria">Criteria</label>
            <angular2-multiselect [data]="dropdownCriteriaList" [(ngModel)]="selectedCriteriaItems"
              [settings]="dropdownCriteriaSettings" (onSelect)="onCriteriaItemSelect($event)"
              (onDeSelect)="OnCriteriaItemDeSelect($event)" (onDeSelectAll)="OnCriteriaItemDeSelect($event)"
              tabindex="6"></angular2-multiselect>
          </div>


          <div class="col-md-6">
            <div *ngIf="
                 criteriaStandard === 'IsLessThanEqualTo' || criteriaStandard === 'IsLessThan'">
              <label for="acceptablelow"> </label>
              <input type="text" class="form-control mt-2" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Value" tabindex="6" />
            </div>
            <div *ngIf="criteriaStandard === 'IsGreaterThan' || criteriaStandard === 'IsGreaterThanEqualTo'">
              <label for="acceptablehigh"> </label>
              <input type="text" class="form-control mt-2" id="acceptablehigh" [(ngModel)]="acceptablehigh"
                (ngModelChange)="validateAccHigh()" placeholder="Enter Value" tabindex="7" />
            </div>
            <div *ngIf="criteriaStandard === 'IsEqualTo' ||criteriaStandard === 'IsNotEqualTo'">
              <label for="acceptablehigh"> </label>
              <input type="text" class="form-control mt-2" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Value" tabindex="6" />
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6" *ngIf=" criteriaStandard === 'IsBetween' || criteriaStandard === 'IsNotInBetween'">
            <label for="acceptablelow"> </label>
              <input type="text" class="form-control" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Low Value" tabindex="6" />
          </div>

          <div class="col-md-6" *ngIf="criteriaStandard === 'IsBetween' || criteriaStandard === 'IsNotInBetween'">
            <label for="acceptablehigh"> </label>
            <input type="text" class="form-control" id="acceptablehigh" [(ngModel)]="acceptablehigh"
              (ngModelChange)="validateAccHigh()" placeholder="Enter High Value" tabindex="8" />
          </div>
        </div>
          <p *ngIf="criteriaErrorMsg !== ''" class="error">
            {{ criteriaErrorMsg }}
          </p>
        </div>

      </div>
  </div>
 </div>
