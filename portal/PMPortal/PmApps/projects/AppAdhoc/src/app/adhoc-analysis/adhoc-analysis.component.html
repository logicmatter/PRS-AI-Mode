<div>

<nav mat-tab-nav-bar class="plans-details-tabs salesport-tabs">
  <a mat-tab-link
  *ngFor="let link of navLinks; let i = index;"

   (click)="activeLinkIndex = i"

  {{link.label}} </a>

  <router-outlet></router-outlet>
</div>
