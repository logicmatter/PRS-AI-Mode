<div class="row" align="right" style="margin-top:10px">
  <div class="col-md-12">
    <button type="button" class="btn btn-outline-primary" style="margin-right: 5px" (click)="goBack()" tabindex="10">
      Back
    </button>
    <button *ngIf="_util.showStandardBack" type="button" class="btn btn-outline-primary" style="margin-right: 5px"
      [disabled]="saveDisable" (click)="updateStandard()" tabindex="12">
      Update
    </button>

    <button *ngIf="!_util.showStandardBack" type="button" class="btn btn-outline-primary" style="margin-right: 5px"
      [disabled]="saveDisable" (click)="onSave()" tabindex="10">
      Save
    </button>

  </div>
</div>
<h5 *ngIf="_util.showStandardBack" class="text-center">UPDATE STANDARD</h5>
<h5 *ngIf="!_util.showStandardBack" class="text-center">ADD STANDARD</h5>

<div class="row">
  <div class="col-md-6">
    <div class="card ">
      <div class="card-body">
        <label for="regulation"><sup class="mandatory-indication">*</sup>Regulation</label>
        <angular2-multiselect id="dropdownRegulationList" [data]="dropdownRegulationList" [(ngModel)]="selectedRegulationItems"
        [settings]="dropdownRegulationSettings" (onSelect)="onRegulationItemSelect($event)"
        (onDeSelect)="OnRegulationItemDeSelect($event)" (onDeSelectAll)="OnRegulationItemDeSelectAll($event)" tabindex="2"
        (onAddFilterNewItem)="onAddRegulationItem($event)">
      </angular2-multiselect>
      <label for="roomType"><sup class="mandatory-indication">*</sup>Environment Type</label>
      <angular2-multiselect id="dropdownRoomTypeList" [data]="dropdownRoomTypeList" [(ngModel)]="selectedRoomTypeItems"
        [settings]="dropdownRoomTypeSettings" (onSelect)="onRoomTypeItemSelect($event)"
        (onDeSelect)="OnRoomTypeItemDeSelect($event)" (onDeSelectAll)="OnItemRoomTypeDeSelectAll($event)" tabindex="1"
        (onAddFilterNewItem)="onAddRoomTypeItem($event)">
      </angular2-multiselect>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <label for="facet"><sup class="mandatory-indication">*</sup>Facet</label>
        <angular2-multiselect id="dropdownList" [data]="dropdownList" [(ngModel)]="selectedItems" [settings]="dropdownSettings"
          (onSelect)="onItemSelect($event)" (onDeSelect)="OnItemDeSelect($event)"
          (onDeSelectAll)="OnItemDeSelect($event)" tabindex="4">
        </angular2-multiselect>
        <div class="row">
          <div class="col-md-6">
            <label for="criteria">Criteria</label>
            <angular2-multiselect id="dropdownCriteriaList" [data]="dropdownCriteriaList" [(ngModel)]="selectedCriteriaItems"
              [settings]="dropdownCriteriaSettings" (onSelect)="onCriteriaItemSelect($event)"
              (onDeSelect)="OnCriteriaItemDeSelect($event)" (onDeSelectAll)="OnCriteriaItemDeSelect($event)"
              tabindex="5"></angular2-multiselect>
          </div>

          <div class="col-md-6">
            <div *ngIf="
                 criteriaStandard === 'IsLessThanEqualTo' || criteriaStandard === 'IsLessThan' ">
              <label for="acceptablelow"> </label>
              <input type="text" class="form-control mt-2" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Value" tabindex="6" />
            </div>
            <div *ngIf="criteriaStandard === 'IsGreaterThan' || criteriaStandard === 'IsGreaterThanEqualTo'">
              <label for="acceptablehigh"> </label>
              <input type="text" class="form-control mt-2" id="acceptablehigh" [(ngModel)]="acceptablehigh"
                (ngModelChange)="validateAccHigh()" placeholder="Enter Value" tabindex="7" />
            </div>
            <div *ngIf="criteriaStandard === 'IsEqualTo' || criteriaStandard === 'IsNotEqualTo'">
              <label for="acceptablehigh"> </label>
              <input type="text" class="form-control mt-2" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Value" tabindex="6" />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6" *ngIf=" criteriaStandard === 'IsBetween' || criteriaStandard === 'IsNotInBetween' ">
              <label for="acceptablelow"> </label>
              <input type="text" class="form-control" id="acceptablelow" [(ngModel)]="acceptablelow"
                (ngModelChange)="validateAccLow()" placeholder="Enter Low Value" tabindex="6" />
            </div>
          <div class="col-md-6" *ngIf="criteriaStandard === 'IsBetween' || criteriaStandard === 'IsNotInBetween'">
            <label for="acceptablehigh"> </label>
            <input type="text" class="form-control" id="acceptablehigh" [(ngModel)]="acceptablehigh"
              (ngModelChange)="validateAccHigh()" placeholder="Enter High Value" tabindex="8" />
          </div>
        </div>
          <p *ngIf="criteriaErrorMsg !== ''" class="error">
            {{ criteriaErrorMsg }}
          </p>
        </div>

      </div>
    </div>
  </div>
