<div class="form-inline mt-2">
  <div class="col-sm-6 edt">
  <label for="end" class="control-label gdp-label">End Date</label>
 
    <input [(ngModel)]="datePickerHelper.arsEndDate" class="selectpicker" [owlDateTime]="arsEndDate1" [disabled]="datePickerHelper.disableTime" [max]="maxDate"
           [owlDateTimeTrigger]="arsEndDate1" [owlDateTimeFilter]="myFilter1" (ngModelChange)="endDateSelection($event, 'date')"
           readonly >
    <owl-date-time [pickerType]="'calendar'" #arsEndDate1></owl-date-time>
    <input [(ngModel)]="datePickerHelper.arsEndDate" class="selectpicker" [owlDateTime]="dt42" [owlDateTimeTrigger]="dt42"
           [disabled]="datePickerHelper.disableTime" (ngModelChange)="endDateSelection($event, 'time')" readonly>
    <owl-date-time [pickerType]="'timer'" [hour12Timer]="'false'" #dt42></owl-date-time>
  </div>
</div>
