<div class="app-content">
    <mat-card>
        <div>
            <div class="form-group">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <input type="text" class="form-control bg-icons-remove is-invalid"
                            [(ngModel)]="TenantFriendlyName" placeholder="Enter Tenant Friendly Name" class="text-box">
                    </div>
                    <div class="col-md-6">
                        <button class="btn btn-outline-primary" [disabled]="!TenantFriendlyName"
                            (click)="updateValue()">Update</button><br />
                    </div>
                </div>
            </div>
        </div>
    </mat-card>
</div>
