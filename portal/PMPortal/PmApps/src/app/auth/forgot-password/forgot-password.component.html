<app-header></app-header>
<div class="my-login-page">
    <section class="h-100">
      <div class="container h-100">
        <div class="row justify-content-md-center align-items-center h-100">
          <div class="card-wrapper">
            <div class="brand">
              <!-- <img src="img/logo.jpg"> -->
            </div>
            <div class="card fat logmbl">
              <div class="card-body">
                <h5 class="card-title">Forgot Password</h5>
                <form (ngSubmit)="forgotPassword()" [formGroup]="forgotForm">
                  <h6 class="alert-danger">{{errorMsg}}</h6>
                  <div class="form-group">
                    <label for="email">E-Mail Address</label>
                    <input type="email" formControlName="username" class="form-control" required autofocus (ngModelChange)="onMailChange($event)">
                    <mat-error *ngIf="isControlHasError('username','required')">
                      Email is required
                    </mat-error>
                    <mat-error *ngIf="isControlHasError('username','email')">
                      Please check the mail format
                    </mat-error>
                    <div class="form-text text-muted">
                      Password reset link will be sent to the provided mail
                    </div>
                  </div>

                  <div class="form-group no-margin">
                    <button [disabled]="loading || forgotForm.invalid" class="btn btn-primary btn-block">
                      Reset Password
                      <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
                    </button>
                  </div>
                </form>
                <div style="text-align:right">
                  <a style="cursor:pointer" [routerLink]="['/auth/login']" class="btn btn-link">Click to Login</a>
                </div>
              </div>
            </div>
            <div class="footer">

            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
